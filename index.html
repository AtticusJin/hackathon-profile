<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hackathon Profile</title>
<!-- ================= 使用说明 =================
  1. 点右上角「编辑资料」，直接在表单里填，页面实时预览；草稿自动保存在浏览器里。
  2. 填完点「导出 HTML」，下载一个填好内容的完整页面。
  3. 把下载的文件发回给豆包（或自己在仓库替换 index.html 并 push），即可更新线上。
  4. 右上角 EN/中 可切换语言；你填的内容也支持中英双份，填哪份显示哪份。
==================================================================== -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1220'/%3E%3Cpath d='M8 23V9l16 9V9' stroke='%234FD1C5' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ================= Token ================= */
:root{
  --bg:#0B1220;--bg-2:#0F1930;--bg-3:#14213D;
  --ink:#E6EDF7;--ink-2:#9FB0CC;--ink-3:#5E7195;
  --line:rgba(230,237,247,.12);--line-strong:rgba(230,237,247,.22);
  --accent:#4FD1C5;--accent-2:#F5A524;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Noto Sans SC','Noto Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --w:min(1120px,92vw);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;
  -webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;
}
::selection{background:rgba(79,209,197,.28)}
a{color:inherit;text-decoration:none}
img,svg{display:block}
button{font-family:var(--sans)}
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .15s linear}

/* ================= 导航 ================= */
nav{position:sticky;top:3px;z-index:50;backdrop-filter:blur(10px);background:rgba(11,18,32,.82);border-bottom:1px solid var(--line)}
.nav-in{max-width:var(--w);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:16px}
.brand{font-family:var(--mono);font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand::before{content:"~/";color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-links{display:flex;gap:22px;font-size:.92rem;color:var(--ink-2)}
.nav-links a{transition:color .18s}
.nav-links a:hover{color:var(--accent)}
.lang-btn{
  font-family:var(--mono);font-size:.8rem;color:var(--ink-2);
  background:var(--bg-2);border:1px solid var(--line-strong);border-radius:8px;
  padding:5px 10px;cursor:pointer;transition:color .15s,border-color .15s;
}
.lang-btn:hover{color:var(--accent);border-color:rgba(79,209,197,.5)}
.edit-btn{
  display:inline-flex;align-items:center;gap:7px;
  font-size:.85rem;font-weight:700;color:#0B1220;background:var(--accent);
  border:none;border-radius:8px;padding:7px 14px;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
}
.edit-btn svg{width:14px;height:14px}
.edit-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(79,209,197,.3)}
@media(max-width:760px){
  .nav-links{display:none}
  .brand{font-size:.85rem}
  .edit-btn span{display:none}
  .edit-btn{padding:7px 10px}
}

/* ================= 通用 ================= */
.section{max-width:var(--w);margin:0 auto;padding:88px 0}
.section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:40px}
.section-head .no{font-family:var(--mono);color:var(--accent);font-size:.9rem;flex:none}
.section-head h2{font-size:1.7rem;font-weight:900}
.section-head .en{font-family:var(--mono);color:var(--ink-3);font-size:.8rem}
.section-head .line{flex:1;height:1px;background:var(--line)}

/* ================= Hero ================= */
.hero{max-width:var(--w);margin:0 auto;padding:84px 0 68px;display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center}
.avatar{width:132px;height:132px;border-radius:18px;background:var(--bg-2);border:1px solid var(--line-strong);display:grid;place-items:center}
.avatar svg{width:88px;height:88px}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.78rem;color:var(--accent);border:1px solid rgba(79,209,197,.35);background:rgba(79,209,197,.07);padding:5px 12px;border-radius:999px;margin-bottom:20px}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(79,209,197,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,209,197,.55)}70%{box-shadow:0 0 0 8px rgba(79,209,197,0)}100%{box-shadow:0 0 0 0 rgba(79,209,197,0)}}
.comment{font-family:var(--mono);color:var(--ink-3);font-size:.85rem;margin-bottom:10px}
.comment::before{content:"// ";color:var(--ink-3)}
h1{font-size:clamp(2.8rem,6.5vw,5rem);font-weight:900;line-height:1.06;margin-bottom:14px;overflow-wrap:anywhere}
h1 .cursor{display:inline-block;width:.55ch;height:1em;background:var(--accent);vertical-align:-.12em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tagline{font-size:1.15rem;color:var(--ink-2);max-width:34em;margin-bottom:8px;overflow-wrap:anywhere}
.typing{font-family:var(--mono);color:var(--ink-3);font-size:.9rem;min-height:1.6em;margin-bottom:28px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:10px;font-weight:700;font-size:.95rem;transition:transform .15s,box-shadow .15s,background .15s;cursor:pointer;border:none}
.btn-primary{background:var(--accent);color:#0B1220}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(79,209,197,.25)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:760px){
  .hero{grid-template-columns:1fr;gap:24px;padding:60px 0 52px}
  .avatar{width:100px;height:100px}
}

/* ================= 三问三答 ================= */
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.qa-card{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:26px 24px;transition:border-color .18s,transform .18s}
.qa-card:hover{border-color:rgba(79,209,197,.45);transform:translateY(-3px)}
.qa-card .q{font-family:var(--mono);font-size:.78rem;color:var(--accent-2);margin-bottom:12px;letter-spacing:.06em}
.qa-card .q::before{content:"> ";color:var(--ink-3)}
.qa-card .a{font-size:.98rem;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.qa-card .a b{color:var(--ink);font-weight:700}
@media(max-width:860px){.qa-grid{grid-template-columns:1fr;gap:12px}}

/* ================= 技能 ================= */
.skill-group{margin-bottom:26px}
.skill-group:last-child{margin-bottom:0}
.skill-group h3{font-family:var(--mono);font-size:.82rem;font-weight:600;color:var(--accent);margin-bottom:12px}
.skill-group h3 span{color:var(--ink-3);font-weight:400}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tag{font-size:.9rem;color:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:6px 14px;background:var(--bg-2);transition:color .15s,border-color .15s}
.tag:hover{color:var(--accent);border-color:rgba(79,209,197,.5)}
.tag .lv{color:var(--ink-3);font-family:var(--mono);font-size:.75rem;margin-left:6px}
.tag.hot{border-color:rgba(245,165,36,.4)}
.tag.hot:hover{color:var(--accent-2);border-color:rgba(245,165,36,.7)}

/* ================= 项目时间轴 ================= */
.timeline{display:grid;grid-template-columns:7.5rem 2.4rem 1fr}
.tl-item{display:contents}
.tl-time{font-family:var(--mono);font-size:.82rem;color:var(--ink-2);padding:22px 0;text-align:right;padding-right:18px}
.tl-axis{position:relative;display:grid;justify-items:center;padding:22px 0}
.tl-axis::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--line-strong);transform:translateX(-50%)}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--accent);justify-self:center;align-self:start;margin-top:2px;position:relative;z-index:1}
.tl-item:first-child .tl-dot{border-color:var(--accent-2);box-shadow:0 0 0 4px rgba(245,165,36,.12)}
.tl-body{padding:20px 0 26px 6px}
.tl-title{font-weight:900;font-size:1.02rem;margin-bottom:4px;overflow-wrap:anywhere}
.tl-title .tagx{font-family:var(--mono);font-size:.72rem;font-weight:600;color:var(--accent);border:1px solid rgba(79,209,197,.35);padding:2px 8px;border-radius:6px;margin-left:10px;vertical-align:2px}
.tl-desc{color:var(--ink-2);font-size:.93rem;max-width:46em;white-space:pre-wrap;overflow-wrap:anywhere}
.tl-empty{font-family:var(--mono);color:var(--ink-3);font-size:.9rem;padding:10px 0 10px 6px}
@media(max-width:700px){.timeline{grid-template-columns:5.5rem 1.6rem 1fr}.tl-time{padding-right:10px;font-size:.75rem}}

/* ================= 联系区 ================= */
.contact{border:1px solid var(--line-strong);border-radius:18px;background:linear-gradient(180deg,var(--bg-2),var(--bg));padding:54px 40px;text-align:center;position:relative;overflow:hidden}
.contact::before{content:"[ RECRUITING ]";position:absolute;top:18px;right:22px;font-family:var(--mono);font-size:.72rem;letter-spacing:.3em;color:var(--ink-3)}
.contact h2{font-size:1.9rem;font-weight:900;margin-bottom:10px}
.contact p{color:var(--ink-2);margin-bottom:28px}
.contact-ways{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.way{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line-strong);border-radius:10px;padding:12px 20px;font-size:.93rem;color:var(--ink-2);background:var(--bg-2);cursor:pointer;transition:border-color .15s,color .15s}
.way svg{width:17px;height:17px}
.way:hover{color:var(--accent);border-color:rgba(79,209,197,.5)}
.way.primary{border-color:var(--accent);color:var(--accent);font-weight:700}
.way.primary:hover{background:rgba(79,209,197,.08)}
.hint{font-family:var(--mono);font-size:.78rem;color:var(--ink-3);margin-top:20px}

/* ================= Footer ================= */
footer{border-top:1px solid var(--line);padding:28px 0;margin-top:40px}
.foot-in{max-width:var(--w);margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:.8rem;color:var(--ink-3);flex-wrap:wrap;gap:8px}
.foot-in .made::before{content:"/* ";color:var(--ink-3)}
.foot-in .made::after{content:" */";color:var(--ink-3)}

/* ================= 编辑抽屉 ================= */
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(420px,94vw);z-index:90;
  background:var(--bg-2);border-left:1px solid var(--line-strong);
  transform:translateX(102%);transition:transform .25s ease;
  display:flex;flex-direction:column;
}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-size:1.05rem;font-weight:900}
.drawer-head .x{background:none;border:none;color:var(--ink-2);font-size:1.4rem;cursor:pointer;line-height:1;padding:4px}
.drawer-head .x:hover{color:var(--accent)}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px 30px}
.fs-title{font-family:var(--mono);font-size:.78rem;color:var(--accent);letter-spacing:.08em;margin:22px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
.fs-title:first-child{border-top:none;margin-top:0;padding-top:0}
.form-row{margin-bottom:13px}
.form-row label{display:block;font-size:.78rem;color:var(--ink-2);margin-bottom:5px;font-family:var(--mono)}
.form-row input,.form-row textarea{
  width:100%;background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;
  color:var(--ink);padding:9px 11px;font-size:14px;font-family:var(--sans);outline:none;
}
.form-row textarea{resize:vertical;min-height:58px;line-height:1.5}
.form-row input:focus,.form-row textarea:focus{border-color:var(--accent)}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bi .cell{min-width:0}
.bi .cell .tag-l{font-size:.68rem;color:var(--ink-3);font-family:var(--mono)}
.row-actions{display:flex;gap:8px;margin-top:6px}
.icon-btn{
  background:var(--bg-3);color:var(--ink-2);border:1px solid var(--line-strong);
  border-radius:7px;padding:5px 10px;font-size:.78rem;cursor:pointer;font-family:var(--mono);
}
.icon-btn:hover{color:var(--accent-2);border-color:rgba(245,165,36,.5)}
.icon-btn.danger:hover{color:#FF6B6B;border-color:rgba(255,107,107,.5)}
.icon-btn.primary{color:var(--accent);border-color:rgba(79,209,197,.4)}
.icon-btn.primary:hover{background:rgba(79,209,197,.08)}
.icon-btn.sm{padding:3px 8px;font-size:.72rem}
.check-row{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:.8rem;color:var(--ink-2);cursor:pointer}
.check-row input{width:auto;accent-color:var(--accent-2)}
.drawer-foot{border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;background:var(--bg-2)}
.drawer-foot .btn{flex:1;justify-content:center;padding:11px 8px;font-size:.88rem}

/* ================= Toast / 回到顶部 ================= */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:var(--bg-3);color:var(--ink);border:1px solid var(--line-strong);border-radius:10px;padding:11px 20px;font-size:.9rem;font-family:var(--mono);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#topBtn{position:fixed;right:26px;bottom:26px;z-index:80;width:44px;height:44px;border-radius:12px;background:var(--bg-3);border:1px solid var(--line-strong);color:var(--accent);font-size:1.1rem;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#topBtn.show{opacity:1;pointer-events:auto}
#topBtn:hover{transform:translateY(-3px)}
.drawer-backdrop{position:fixed;inset:0;background:rgba(4,8,16,.55);z-index:85;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-backdrop.show{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="progress"><i id="bar"></i></div>

<!-- ================= 导航 ================= -->
<nav>
  <div class="nav-in">
    <a class="brand" href="#top">hackathon_profile</a>
    <div class="nav-right">
      <button class="lang-btn" id="langBtn" title="Switch language">EN / 中</button>
      <button class="edit-btn" id="editBtn" title="Edit profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
        <span data-i18n="editBtn">编辑资料</span>
      </button>
      <div class="nav-links">
        <a href="#about" data-i18n="navAbout">关于我</a>
        <a href="#skills" data-i18n="navSkills">技能</a>
        <a href="#projects" data-i18n="navProjects">项目</a>
        <a href="#contact" data-i18n="navContact">联系</a>
      </div>
    </div>
  </div>
</nav>

<!-- ================= 01 Hero ================= -->
<header class="hero" id="top">
  <div class="avatar" aria-hidden="true">
    <svg viewBox="0 0 88 88" fill="none">
      <rect x="26" y="14" width="36" height="36" rx="10" stroke="#4FD1C5" stroke-width="3"/>
      <circle cx="38" cy="26" r="2.6" fill="#4FD1C5"/>
      <circle cx="50" cy="26" r="2.6" fill="#4FD1C5"/>
      <path d="M36 34c2.6 2.4 6 2.4 8.6 0l-1 3c-1.8 1.6-4.8 1.6-6.6 0l-1-3z" fill="#F5A524"/>
      <path d="M30 70c0-7.7 6.3-14 14-14s14 6.3 14 14" stroke="#4FD1C5" stroke-width="3" stroke-linecap="round"/>
      <path d="M8 66h12M8 60h12" stroke="#9FB0CC" stroke-width="2" stroke-linecap="round"/>
      <path d="M68 66h12M68 60h12" stroke="#9FB0CC" stroke-width="2" stroke-linecap="round"/>
      <path d="M40 4h14M44 1l-3 6M50 1l-3 6" stroke="#5E7195" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <div>
    <span class="badge"><i></i><span id="badgeText"></span></span>
    <p class="comment">hackathon_profile v2.0 — bilingual</p>
    <h1><span id="nickname"></span><span class="cursor"></span></h1>
    <p class="tagline" id="tagline"></p>
    <p class="typing" id="typing"></p>
    <div class="hero-cta">
      <a class="btn btn-primary" href="#contact" data-i18n="ctaTeam">找我组队</a>
      <a class="btn btn-ghost" href="#projects" data-i18n="ctaProjects">看我的项目</a>
    </div>
  </div>
</header>

<main>
<!-- ================= 02 三问三答 ================= -->
<section class="section" id="about">
  <div class="section-head">
    <span class="no">01</span>
    <h2 data-i18n="aboutTitle">三句话认识我</h2>
    <span class="en">WHO / WHAT / WHY</span>
    <span class="line"></span>
  </div>
  <div class="qa-grid" id="qaGrid"></div>
</section>

<!-- ================= 03 技能栈 ================= -->
<section class="section" id="skills">
  <div class="section-head">
    <span class="no">02</span>
    <h2 data-i18n="skillsTitle">技能栈</h2>
    <span class="en">STACK</span>
    <span class="line"></span>
  </div>
  <div id="skillWrap"></div>
</section>

<!-- ================= 04 项目经历 ================= -->
<section class="section" id="projects">
  <div class="section-head">
    <span class="no">03</span>
    <h2 data-i18n="projectsTitle">项目经历</h2>
    <span class="en">PROJECTS</span>
    <span class="line"></span>
  </div>
  <div class="timeline" id="timeline"></div>
</section>

<!-- ================= 05 联系区 ================= -->
<section class="section" id="contact">
  <div class="contact">
    <h2 data-i18n="contactTitle">一起做点东西？</h2>
    <p data-i18n="contactSub">如果你也报名了同一场黑客松，或正好缺这样的队友 —— 随时戳我。</p>
    <div class="contact-ways" id="contactWays"></div>
    <p class="hint" data-i18n="contactHint">// 在「编辑资料」里填好联系方式，这里会自动更新。</p>
  </div>
</section>
</main>

<footer>
  <div class="foot-in">
    <span id="footCopy"></span>
    <span class="made">made with vim in 48h</span>
  </div>
</footer>

<button id="topBtn" aria-label="Back to top">↑</button>
<div id="toast" role="status"></div>

<!-- ================= 编辑抽屉 ================= -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer" aria-label="Edit profile">
  <div class="drawer-head">
    <h3 data-i18n="drawerTitle">编辑资料</h3>
    <button class="x" id="drawerClose" aria-label="Close">×</button>
  </div>
  <div class="drawer-body" id="formBody"></div>
  <div class="drawer-foot">
    <button class="btn btn-ghost" id="saveDraftBtn" style="flex:0 0 auto;font-size:.85rem" data-i18n="saveDraft">存草稿</button>
    <button class="btn btn-primary" id="exportBtn" data-i18n="exportBtn">导出 HTML</button>
  </div>
</aside>

<script>
/* ================================================================
   PROFILE：你的全部资料（双语）。页面上的「编辑资料」会直接改这份数据，
   也可以在导出 HTML 后自动嵌入新文件。默认值 = 占位示例。
   ================================================================ */
const PROFILE = /*__PROFILE__*/{

/* 工具 */
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function t(k){return (I18N[LANG]||I18N.en)[k]??k}
function pick(o){return (o&&o[LANG]!==undefined&&String(o[LANG]).trim()!=='')?o[LANG]:((o&&o.en!==undefined&&String(o.en).trim()!=='')?o.en:(o&&o.zh!==undefined?o.zh:''))}
function deepMerge(base, patch){
  if(!patch||typeof patch!=='object') return base;
  const out = Array.isArray(base)? base.slice() : {...base};
  for(const k of Object.keys(patch)){
    if(patch[k]&&typeof patch[k]==='object'&&!Array.isArray(patch[k])&&base[k]&&typeof base[k]==='object'){
      out[k] = deepMerge(base[k], patch[k]);
    }else{
      out[k] = patch[k];
    }
  }
  return out;
}

/* ============ 打字机 ============ */
const typingEl = $('#typing');
let li=0, ci=0, deleting=false;
function lines(){ const l = PROFILE.lines[LANG]||PROFILE.lines.en||[]; return l.length? l : ['']; }
function tick(){
  const line = lines()[li];
  if(!deleting){ ci++; typingEl.textContent = line.slice(0,ci); if(ci===line.length){deleting=true;setTimeout(tick,1700);return;} setTimeout(tick,42); }
  else{ ci--; typingEl.textContent = line.slice(0,ci); if(ci===0){deleting=false;li=(li+1)%lines().length;setTimeout(tick,350);return;} setTimeout(tick,16); }
}
function restartTyping(){ typingEl.textContent=''; li=0;ci=0;deleting=false; tick(); }
if(matchMedia('(prefers-reduced-motion: reduce)').matches){ typingEl.textContent = lines()[0]; }

/* 表单构建 */
function fld(label, path, opts={}){
  const v = getByPath(PROFILE, path) ?? '';
  return `<div class="form-row"><label>${label}</label><input type="text" data-path="${path}" value="${esc(v)}" placeholder="${esc(opts.ph||'')}"></div>`;
}
function biField(label, path){
  return `<div class="form-row"><label>${label}</label><div class="bi">
    <div class="cell"><div class="tag-l">EN</div><input data-path="${path}.en" type="text" value="${esc(getByPath(PROFILE,path+'.en')||'')}"></div>
    <div class="cell"><div class="tag-l">中文</div><input data-path="${path}.zh" type="text" value="${esc(getByPath(PROFILE,path+'.zh')||'')}"></div>
  </div></div>`;
}
function biLine(i){
  return `<div class="form-row"><label>${t('lLines')} ${i+1}</label><div class="bi">
    <div class="cell"><div class="tag-l">EN</div><input data-path="lines.en.${i}" value="${esc(PROFILE.lines.en[i]||'')}"></div>
    <div class="cell"><div class="tag-l">中文</div><input data-path="lines.zh.${i}" value="${esc(PROFILE.lines.zh[i]||'')}"></div>
  </div></div>`;
}
function biArea(label, path){
  return `<div class="form-row"><label>${label}</label><div class="bi">
    <div class="cell"><div class="tag-l">EN</div><textarea data-path="${path}.en">${esc(getByPath(PROFILE,path+'.en')||'')}</textarea></div>
    <div class="cell"><div class="tag-l">中文</div><textarea data-path="${path}.zh">${esc(getByPath(PROFILE,path+'.zh')||'')}</textarea></div>
  </div></div>`;
}
function getByPath(o, path){
  return path.split('.').reduce((acc,k)=> acc==null?undefined:acc[k], o);
}
function setByPath(o, path, val){
  const keys = path.split('.'); let cur = o;
  for(let i=0;i<keys.length-1;i++){ cur = cur[keys[i]]; }
  cur[keys[keys.length-1]] = val;
}
function buildForm(){
  const c = PROFILE.contact;
  let html = '';
  html += `<div class="fs-title">${t('fBasic')}</div>`;
  html += biField(t('lNick'), 'nickname');
  html += biArea(t('lTagline'), 'tagline');
  html += biField(t('lBadge'), 'badge');
  html += fld(t('lCity'), 'city');
  for(let i=0;i<3;i++){ html += biLine(i); }
  html += `<div class="fs-title">${t('fQA')}</div>`;
  html += biArea(t('lQA1'), 'qa.0');
  html += biArea(t('lQA2'), 'qa.1');
  html += biArea(t('lQA3'), 'qa.2');
  html += `<div class="fs-title">${t('fSkills')}</div>`;
  PROFILE.skills.forEach((g,gi)=>{
    html += `<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px">`;
    html += `<div class="form-row"><label>${t('lCat')} ${gi+1}</label><div class="bi">
      <div class="cell"><div class="tag-l">EN</div><input data-path="skills.${gi}.cat.en" value="${esc(g.cat.en||'')}"></div>
      <div class="cell"><div class="tag-l">中文</div><input data-path="skills.${gi}.cat.zh" value="${esc(g.cat.zh||'')}"></div></div></div>`;
    g.tags.forEach((tg,ti)=>{
      html += `<div class="form-row"><label>${t('lTag')} ${ti+1}</label><div class="bi">
        <div class="cell"><div class="tag-l">EN</div><input data-path="skills.${gi}.tags.${ti}.t_en" value="${esc(tg.t_en||'')}"></div>
        <div class="cell"><div class="tag-l">中文</div><input data-path="skills.${gi}.tags.${ti}.t_zh" value="${esc(tg.t_zh||'')}"></div></div>
        <div style="display:flex;gap:8px;margin-top:6px;align-items:center;flex-wrap:wrap">
          <input style="width:auto;flex:1;min-width:80px" data-path="skills.${gi}.tags.${ti}.lv" placeholder="${t('lLv')}" value="${esc(tg.lv||'')}">
          <label class="check-row" style="margin:0;flex:none"><input type="checkbox" data-path="skills.${gi}.tags.${ti}.hot" ${tg.hot?'checked':''}>${t('lHot')}</label>
          <button class="icon-btn danger sm" data-del="skills.${gi}.tags.${ti}">${t('del')}</button>
        </div></div>`;
    });
    html += `<div class="row-actions"><button class="icon-btn primary sm" data-add="tag:${gi}">${t('addTag')}</button><button class="icon-btn danger sm" data-del="skills.${gi}">${t('del')+' '+t('lCat')}</button></div></div>`;
  });
  html += `<button class="icon-btn primary" data-add="group">${t('addGroup')}</button>`;
  html += `<div class="fs-title">${t('fProjects')}</div>`;
  PROFILE.projects.forEach((p,pi)=>{
    html += `<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px">`;
    html += `<div class="form-row"><label>${t('lTime')}</label><input data-path="projects.${pi}.time" value="${esc(p.time||'')}"></div>`;
    html += biField(t('lTitle'), `projects.${pi}.title`);
    html += `<div class="form-row"><label>${t('lProjTag')}</label><input data-path="projects.${pi}.tag" value="${esc(p.tag||'')}"></div>`;
    html += biArea(t('lDesc'), `projects.${pi}.desc`);
    html += `<div class="row-actions"><button class="icon-btn danger sm" data-del="projects.${pi}">${t('del')}</button></div></div>`;
  });
  html += `<button class="icon-btn primary" data-add="project">${t('addProj')}</button>`;
  html += `<div class="fs-title">${t('fContact')}</div>`;
  html += fld(t('lEmail'), 'contact.email');
  html += fld(t('lGithub'), 'contact.github');
  html += fld(t('lWechat'), 'contact.wechat');
  $('#formBody').innerHTML = html;
}

/* 表单事件（事件委托） */
let renderTimer;
function scheduleRender(){ clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 120); }
$('#formBody').addEventListener('input', e=>{
  const el = e.target; const path = el.dataset.path;
  if(!path) return;
  const val = el.type==='checkbox' ? el.checked : el.value;
  setByPath(PROFILE, path, val); scheduleRender();
});
$('#formBody').addEventListener('click', e=>{
  const tgt = e.target;
  const del = tgt.closest('[data-del]');
  if(del){
    const path = del.dataset.del;
    const m = path.match(/^skills\.(\d+)(\.tags\.(\d+))?$|^projects\.(\d+)$/);
    if(m){
      if(path.startsWith('skills.') && m[3]!==undefined){ PROFILE.skills[+m[1]].tags.splice(+m[3],1); }
      else if(path.startsWith('skills.')){ PROFILE.skills.splice(+m[1],1); }
      else if(path.startsWith('projects.')){ PROFILE.projects.splice(+m[4],1); }
      buildForm(); renderAll(); saveDraft();
    }
    return;
  }
  const add = tgt.closest('[data-add]');
  if(add){
    const what = add.dataset.add;
    if(what==='group'){ PROFILE.skills.push({cat:{en:'',zh:''},tags:[{t_en:'',t_zh:'',lv:'',hot:false}]}); }
    else if(what==='project'){ PROFILE.projects.push({time:'',tag:'',title:{en:'',zh:''},desc:{en:'',zh:''}}); }
    else if(what.startsWith('tag:')){ const gi=+what.split(':')[1]; PROFILE.skills[gi].tags.push({t_en:'',t_zh:'',lv:'',hot:false}); }
    buildForm(); renderAll(); saveDraft();
    return;
  }
});

/* 保存草稿 / 导出 */
function saveDraft(){ try{ localStorage.setItem('hk_profile', JSON.stringify(PROFILE)); }catch(e){} }
$('#saveDraftBtn').addEventListener('click', ()=>{ saveDraft(); showToast(t('saved')); });
$('#exportBtn').addEventListener('click', ()=>{
  saveDraft();
  closeDrawer();
  const html = document.documentElement.outerHTML;
  const safe = JSON.stringify(PROFILE).replace(/</g,'\\u003c');
  const out = html.replace(/\/\*__PROFILE__\*\/[\s\S]*?\/\*__PROFILE_END__\*\//, safe);
  const blob = new Blob([out], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hackathon-profile.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  showToast(t('exported'));
});

/* ============ Toast / 进度条 / 回到顶部 ============ */
const toast=$('#toast'); let toastTimer;
function showToast(msg){ toast.textContent=msg; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),2600); }
const bar=$('#bar'), topBtn=$('#topBtn');
window.addEventListener('scroll', ()=>{
  const h=document.documentElement;
  bar.style.width = (h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';
  topBtn.classList.toggle('show', h.scrollTop>600);
},{passive:true});
topBtn.addEventListener('click', ()=>window.scrollTo({top:0,behavior:'smooth'}));

/* ============ 启动 ============ */
renderAll();
restartTyping();
